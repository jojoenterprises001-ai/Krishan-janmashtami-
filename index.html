<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krishna Janmashtami Live Darshan</title>
    
    <!-- Google Fonts for Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="public-body" class="theme-royal-krishna">

    <!-- Background Canvas for Flower Rain & Animations -->
    <canvas id="effects-canvas"></canvas>

    <!-- Main Content Wrapper -->
    <div class="content-wrapper">
        
        <!-- Subtle Header Credit -->
        <header class="credit-header">
            <i class="fa-solid fa-feather"></i>
            <span>web design by shlok chaudhary</span>
            <i class="fa-solid fa-feather"></i>
        </header>

        <main class="main-container">
            <!-- Hero Section -->
            <section class="hero-section">
                <h2 class="sub-heading">Jai Shri Krishna</h2>
                <h1 class="main-heading">Divine Live Darshan</h1>
                <p class="devotional-text">"Experience the divine presence of Lord Krishna from the comfort of your home."</p>
            </section>

            <!-- Dynamic Announcement Banner -->
            <div id="announcement-banner" class="glass-panel hidden">
                <p id="announcement-text"></p>
            </div>

            <!-- Live TV Box Area -->
            <section class="tv-section">
                
                <!-- Live Status Badge -->
                <div class="badge-container">
                    <div id="live-status-badge" class="status-badge scheduled-state">
                        <span id="status-indicator" class="indicator-dot"></span>
                        <span id="status-text">Live Darshan Starting Soon</span>
                    </div>
                </div>

                <!-- TV Box Player -->
                <div class="tv-box glowing-border">
                    <!-- Default Video ID set to Qt8zL525RZQ -->
                    <iframe id="youtube-player" 
                            src="https://www.youtube.com/embed/Qt8zL525RZQ?autoplay=1&mute=1&rel=0&modestbranding=1" 
                            title="Krishna Janmashtami Live Darshan" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                    </iframe>
                </div>
            </section>

            <!-- Dynamic Countdown Timer -->
            <section id="countdown-section" class="countdown-section hidden">
                <h3 class="countdown-title">Darshan begins in</h3>
                <div class="countdown-grid">
                    <div class="time-box glass-panel">
                        <span id="cd-days" class="time-number">00</span>
                        <span class="time-label">Days</span>
                    </div>
                    <div class="time-box glass-panel">
                        <span id="cd-hours" class="time-number">00</span>
                        <span class="time-label">Hours</span>
                    </div>
                    <div class="time-box glass-panel">
                        <span id="cd-minutes" class="time-number">00</span>
                        <span class="time-label">Mins</span>
                    </div>
                    <div class="time-box glass-panel">
                        <span id="cd-seconds" class="time-number">00</span>
                        <span class="time-label">Secs</span>
                    </div>
                </div>
            </section>

            <!-- Contact Buttons -->
            <section class="contact-section">
                <a href="https://wa.me/917689874945" target="_blank" rel="noopener noreferrer" class="contact-btn whatsapp-btn glass-panel">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>Contact via WhatsApp</span>
                </a>
                <a href="mailto:jojoenterprises001@gmail.com" class="contact-btn email-btn glass-panel">
                    <i class="fa-regular fa-envelope"></i>
                    <span>Email Us</span>
                </a>
            </section>

        </main>
    </div>

    <!-- External JavaScript Files -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
